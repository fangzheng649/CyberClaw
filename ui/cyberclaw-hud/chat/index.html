<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberClaw — CyberAgent 对话</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Bootstrap + AdminLTE dark theme overrides -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3/dist/css/adminlte.min.css" />
    <!-- DataTables Bootstrap4 -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap4.min.css" />
    <!-- CyberClaw dark theme overrides (MUST load after AdminLTE) -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../src/dashboard.css" />
    <link rel="icon" type="image/svg+xml" href="/cyberclaw-logo.svg" />
  </head>
  <body>
    <div id="app">
      <!-- Top Navigation -->
      <header class="topbar">
        <div class="topbar-brand">
          <img src="/cyberclaw-logo.svg" alt="CyberClaw" class="brand-logo" />
          <span class="brand">CYBER<span class="brand-accent">CLAW</span></span>
          <span class="brand-sub">CyberAgent</span>
        </div>
        <nav class="tabs">
          <button class="tab active" data-tab="chat">对话</button>
          <button class="tab" data-tab="dashboard">Dashboard</button>
          <button class="tab" data-tab="devices">设备</button>
          <button class="tab" data-tab="events">事件</button>
          <button class="tab" data-tab="automate">Automate</button>
        </nav>
        <button class="hud-link" id="btn-open-hud" title="打开 3D 安全 HUD">
          <span class="hud-link-icon">⬡</span> 3D HUD
        </button>
      </header>

      <!-- Tab: Chat -->
      <main class="tab-content active" id="tab-chat">
        <!-- Left Sidebar: Conversation List -->
        <aside class="chat-sidebar" id="chat-sidebar">
          <div class="sidebar-header">
            <button class="sidebar-new-chat" id="btn-new-chat">
              <i class="fa-solid fa-plus"></i> 开启新对话
            </button>
          </div>
          <div class="conversation-list" id="conversation-list">
            <!-- populated by JS -->
          </div>
        </aside>
        <!-- Main Chat Area -->
        <div class="chat-main">
          <div class="chat-messages" id="chat-messages">
            <div class="chat-welcome">
              <div class="welcome-icon">⬡</div>
              <h2>CyberAgent 就绪</h2>
              <p>IoT 安全智能助手已上线。你可以用自然语言提问或下达安全指令。</p>
              <div class="quick-actions">
                <button class="quick-btn" data-prompt="帮我检查网络中所有 IoT 设备的安全状态"><i class="fa-solid fa-shield-halved"></i> 扫描网络安全状态</button>
                <button class="quick-btn" data-prompt="分析当前有哪些安全漏洞"><i class="fa-solid fa-bug"></i> 分析安全漏洞</button>
                <button class="quick-btn" data-prompt="生成今天的安全巡检报告"><i class="fa-solid fa-clipboard-check"></i> 生成巡检报告</button>
                <button class="quick-btn" data-prompt="回放最近的攻击过程"><i class="fa-solid fa-clock-rotate-left"></i> 攻击复盘</button>
              </div>
            </div>
          </div>
          <!-- Input Bar (moved inside chat-main) -->
          <footer class="input-bar">
            <div class="input-wrapper">
              <input type="text" id="chat-input" class="chat-input" placeholder="输入问题，或 / 查看命令..." autocomplete="off" />
              <button id="btn-send" class="btn-send">发送</button>
            </div>
          </footer>
        </div>
      </main>

      <!-- Tab: Dashboard -->
      <main class="tab-content" id="tab-dashboard">
        <div id="dashboard-content"></div>
      </main>

      <!-- Tab: Devices -->
      <main class="tab-content" id="tab-devices">
        <div class="rp-layout">
          <div class="rp-toolbar">
            <div class="rp-controls" id="dev-controls"></div>
          </div>
          <div class="rp-body" id="dev-body">
            <div class="empty-state">加载数据中...</div>
          </div>
        </div>
      </main>

      <!-- Tab: Events -->
      <main class="tab-content" id="tab-events">
        <div class="rp-layout">
          <div class="rp-toolbar">
            <div class="rp-controls" id="evt-controls"></div>
          </div>
          <div class="rp-body" id="evt-body">
            <div class="empty-state">加载数据中...</div>
          </div>
        </div>
      </main>

      <!-- Tab: Automate -->
      <main class="tab-content" id="tab-automate">
        <div class="ops-layout">
          <div class="ops-left">
            <section class="ops-section">
              <h3>采集器管理</h3>
              <div class="collectors-grid" id="collectors-grid">
                <div class="empty-state">加载中...</div>
              </div>
            </section>
            <section class="ops-section">
              <h3>预设安全任务</h3>
              <div class="preset-tasks-grid" id="preset-tasks-grid">
                <div class="empty-state">加载中...</div>
              </div>
            </section>
            <section class="ops-section">
              <h3>自定义任务
                <button class="ops-action-btn start" id="btn-add-task"
                        style="font-size:10px;padding:2px 8px;float:right">+ 新建任务</button>
              </h3>
              <div class="custom-tasks-list" id="custom-tasks-list">
                <div class="empty-state">暂无自定义任务</div>
              </div>
            </section>
            <section class="ops-section flex-1">
              <h3>活跃工作流</h3>
              <button class="ops-action-btn start" id="btn-add-wf" style="margin-bottom:8px;width:100%">+ New Workflow</button>
              <div class="wf-list" id="wf-list">
                <div class="empty-state">加载中...</div>
              </div>
            </section>
          </div>
          <div class="ops-right">
            <section class="ops-section">
              <h3>通知通道</h3>
              <div class="notif-channels" id="notif-channels">
                <div class="empty-state">加载中...</div>
              </div>
            </section>
            <section class="ops-section">
              <h3>通知分类</h3>
              <div class="notif-section-filters" id="notif-section-filters">
                <button class="notif-filter-btn active" data-section="">全部</button>
                <button class="notif-filter-btn" data-section="new_devices"><i class="fa-solid fa-circle-plus"></i> 新设备</button>
                <button class="notif-filter-btn" data-section="down_devices"><i class="fa-solid fa-circle-xmark"></i> 离线</button>
                <button class="notif-filter-btn" data-section="security_events"><i class="fa-solid fa-bolt"></i> 安全</button>
                <button class="notif-filter-btn" data-section="scheduled_checks"><i class="fa-solid fa-clock"></i> 定时</button>
                <button class="notif-filter-btn" data-section="system"><i class="fa-solid fa-circle-info"></i> 系统</button>
              </div>
              <select class="ops-input notif-sev-filter" id="notif-sev-filter" style="width:100%;margin-top:6px;font-size:10px;">
                <option value="">全部严重程度</option>
                <option value="critical">Critical</option>
                <option value="warning">Warning</option>
                <option value="high">High</option>
                <option value="info">Info</option>
              </select>
            </section>
            <section class="ops-section">
              <h3>工作流事件</h3>
              <div class="wf-evt-list" id="wf-evt-list">
                <div class="empty-state">加载中...</div>
              </div>
            </section>
            <section class="ops-section flex-1">
              <div class="hist-main-header">
                <h3>通知历史 <span class="notif-unread-badge" id="notif-unread-badge" style="display:none"></span></h3>
                <div class="hist-header-actions">
                  <button class="ops-action-btn start hist-test-btn" id="btn-notif-test">发送测试</button>
                  <button class="ops-action-btn" id="btn-notif-refresh" style="background:var(--accent)">刷新</button>
                </div>
              </div>
              <div class="notif-history" id="notif-history">
                <div class="empty-state">加载中...</div>
              </div>
            </section>
          </div>
        </div>
        <!-- Task Creation Modal -->
        <div class="task-modal-overlay" id="task-modal-overlay" style="display:none">
          <div class="task-modal" id="task-modal"></div>
        </div>
      </main>

      <!-- Device Detail Slide Panel -->
      <div class="device-panel" id="device-panel">
        <div class="dpn-header">
          <button class="dpn-close" id="dpn-close">&times;</button>
          <div class="dpn-device-name" id="dpn-name"></div>
          <span class="status-badge" id="dpn-status-badge"></span>
        </div>
        <div class="dpn-nav">
          <button class="dpn-tab active" data-dpn="overview">概览</button>
          <button class="dpn-tab" data-dpn="events">事件</button>
          <button class="dpn-tab" data-dpn="connections">连接</button>
        </div>
        <div class="dpn-body" id="dpn-body"></div>
        <div class="dpn-footer">
          <button class="dpn-prev" id="dpn-prev">&lsaquo; Prev</button>
          <span id="dpn-position" style="font-size:10px;color:var(--muted)"></span>
          <button class="dpn-next" id="dpn-next">Next &rsaquo;</button>
        </div>
      </div>
    </div>

    <!-- jQuery + Bootstrap + AdminLTE -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3/dist/js/adminlte.min.js"></script>
    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap4.min.js"></script>
    <!-- Marked.js for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- Treeviz for network topology tree -->
    <script src="/lib/treeviz.iife.js"></script>
    <!-- Toast container -->
    <div class="toast-container" id="toast-container"></div>
    <script src="main.js" type="module"></script>
  </body>
</html>
