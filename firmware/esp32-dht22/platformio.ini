; ============================================================================
; CyberClaw IoT Lab — ESP32-S3 + DHT22 节点 (PlatformIO 配置)
; ============================================================================
; 用 VSCode + PlatformIO 打开本文件夹即可。
; 库已手动放到 lib/ 文件夹，不走 registry（国内 registry 经常卡）。

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 强制扫描 lib/ 下所有本地库（解决 DHT.h 找不到的问题）
lib_ldf_mode = deep+

; ESP32-S3: 让 Serial 从原生 USB 口输出（解决串口监视器空白）
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; 串口监视器波特率
monitor_speed = 115200

; 本地库（lib/ 文件夹）：PubSubClient、DHT_sensor_library
; 无需 lib_deps，PlatformIO 自动编译 lib/ 下的库
